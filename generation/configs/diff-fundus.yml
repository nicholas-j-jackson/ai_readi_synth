model:
  base_learning_rate: 5.0e-05
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0295
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: class_label
    image_size: 32
    channels: 3
    cond_stage_trainable: true
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215

    first_stage_config:
      target: ldm.models.autoencoder.IdentityFirstStage

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 3
        out_channels: 3
        model_channels: 224
        attention_resolutions:
        - 8
        - 4
        - 2
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_heads: 8
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 512
        use_checkpoint: true
        legacy: False


    cond_stage_config:
      target: ldm.modules.encoders.modules.MultiClassEmbedder
      params:
        n_classes: 21
        embed_dim: 512
        key: 'class_label'


data:
  params:
    batch_size: 32
    data_path: /data/7TB/nick/ai_readi_v3/
    test_size: 10000
    num_workers: 8
    task: fundus
    pre_embed: True

lightning:
  callbacks:
    image_logger:
      target: scripts.01_train_ldm.ImageLogger
      params:
        batch_frequency: 10000
        max_images: 8
        increase_log_steps: False

  trainer:
    gpus: 4
    benchmark: False